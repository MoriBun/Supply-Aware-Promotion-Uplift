[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-aware-sim"
version = "0.1.0"
description = "Agent-based ride-hailing simulator for the Supply-Aware Promotion Impact Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["matplotlib>=3.8"]   # gate plots in analysis/plots.py (decisions T-13); sim/ never imports it

[tool.setuptools.packages.find]
include = ["sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: acceptance tests, run with: pytest -q -m slow"]
